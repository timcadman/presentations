name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build all presentations
        run: |
          mkdir -p _site
          for dir in */; do
            if [ -f "${dir}slides.md" ] && [ -f "${dir}package.json" ]; then
              name="${dir%/}"
              echo "Building: $name"
              cd "$dir"
              npm install
              npx slidev build slides.md --base "/presentations/${name}/"
              # Create index.html copies for each slide route so GitHub Pages can serve them
              slide_count=$(grep -c '^---$' slides.md)
              for i in $(seq 1 $slide_count); do
                mkdir -p "dist/$i"
                cp dist/index.html "dist/$i/index.html"
              done
              mv dist "../_site/${name}"
              cd ..
            fi
          done
      - name: Create index page
        run: |
          echo '<html><body><h1>Presentations</h1><ul>' > _site/index.html
          for dir in _site/*/; do
            name="$(basename "$dir")"
            echo "<li><a href=\"${name}/\">${name}</a></li>" >> _site/index.html
          done
          echo '</ul></body></html>' >> _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
