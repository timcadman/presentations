id: how-combine-data
sourceSlide: "Combining data — Options 1-3"
captureType: slidev
steps:
  - clicks: 0
    text: >-
      So how do we combine data? The first option is to transfer all the data to one
      location. This is simple for the analyst, but it raises ethical and legal
      barriers, data owners lose control of their data, and large datasets are costly
      to store.
  - clicks: 1
    text: >-
      The second option is to send an analysis script to each site, and meta-analyse
      the results. No data is shared, but it is slow, and limited to two-stage methods.
  - clicks: 2
    text: >-
      The third option is federated analysis. The analysis code is sent to the data,
      and only aggregate results come back. The data never leaves its location, and
      owners keep control of who can access it.
